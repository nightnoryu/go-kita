name: Release

on:
  push:
    tags: [ 'v*.*.*' ]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build release notes
        id: notes
        run: |
          tag='${{ github.ref_name }}'
          changelog="$(awk -v tag="$tag" '
            $1 == "##" && $2 == tag { capture = 1; next }
            $1 == "##" && capture { exit }
            capture {
              if ($0 ~ /[^[:space:]]/) { for (; pending > 0; pending--) print ""; print; started = 1 }
              else if (started) pending++
            }
          ' CHANGELOG.md)"

          prev_tag="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"

          {
            echo 'body<<CHANGELOG_EOF'
            echo "# What's Changed"
            echo
            echo "$changelog"
            if [ -n "$prev_tag" ]; then
              echo
              echo "**Full Changelog**: ${{ github.server_url }}/${{ github.repository }}/compare/${prev_tag}...${tag}"
            fi
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
