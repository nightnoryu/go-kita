[tools]
go = "1.27.3"
golangci-lint = "2.15.0"

[tasks.default]
run = [
    { task = "build" },
    { task = "check" },
]

[tasks.modules]
run = "go mod download"
sources = [ "go.*" ]
outputs = { auto = true }

[tasks.tidy]
run = "go mod tidy"

[tasks.build]
depends = [ "modules" ]
run = "go build -o /dev/null ./..."
sources = [
    "**/*.go",
    "go.*",
]

[tasks.check]
depends = [ "lint", "test", "test:race" ]

[tasks.lint]
run = "golangci-lint run"

[tasks.test]
run = "go test ./..."

[tasks."test:race"]
run = "go test -race ./postgresql"
